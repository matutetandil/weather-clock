name: Publish to Chrome Web Store

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension ZIP
        run: |
          zip -r extension.zip \
            manifest.json \
            newtab.html \
            newtab.js \
            background.js \
            icons/ \
            data/

      - name: Verify bundled data is present
        run: |
          unzip -l extension.zip | grep -q 'data/emma-regions.json' \
            || { echo "data/emma-regions.json missing from package - MeteoAlarm would silently return no alerts"; exit 1; }

      - name: Upload to Chrome Web Store
        run: |
          npx chrome-webstore-upload-cli@3 upload \
            --source extension.zip \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish extension
        run: |
          npx chrome-webstore-upload-cli@3 publish \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}
